<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediConnect - Konsultasi Video Telemedicine</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="40" height="40" rx="8" fill="#4F46E5"/>
                    <path d="M20 10V30M10 20H30" stroke="white" stroke-width="3" stroke-linecap="round"/>
                </svg>
                <h1>MediConnect</h1>
            </div>
            <div class="connection-status" id="connectionStatus">
                <span class="status-dot"></span>
                <span class="status-text">Terputus</span>
            </div>
        </header>

        <!-- Login Section -->
        <div id="loginSection" class="section">
            <div class="login-container">
                <h2>Selamat Datang di MediConnect</h2>
                <p class="subtitle">Platform Konsultasi Video dengan Tenaga Kesehatan</p>
                
                <div class="login-form">
                    <div class="form-group">
                        <label for="userName">Nama Anda</label>
                        <input type="text" id="userName" placeholder="Masukkan nama lengkap" required>
                    </div>

                    <div class="form-group">
                        <label for="roomId">ID Ruang Konsultasi</label>
                        <input type="text" id="roomId" placeholder="Masukkan ID ruang atau buat baru" required>
                    </div>

                    <div class="form-group">
                        <label>Saya adalah:</label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="userType" value="doctor">
                                <span class="radio-custom"></span>
                                <span>Dokter / Tenaga Kesehatan</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="userType" value="patient" checked>
                                <span class="radio-custom"></span>
                                <span>Pasien</span>
                            </label>
                        </div>
                    </div>

                    <button id="joinBtn" class="btn btn-primary">Mulai Konsultasi</button>
                </div>

                <div class="info-box">
                    <h3>M</h3>
                </div>
            </div>
        </div>

        <!-- Video Consultation Section -->
        <div id="videoSection" class="section hidden">
            <div class="video-container">
                <!-- Remote Video (Lawan bicara) -->
                <div class="video-wrapper remote-video-wrapper">
                    <video id="remoteVideo" autoplay playsinline></video>
                    <div class="video-label">
                        <span id="remoteUserName">Menunggu peserta lain...</span>
                    </div>
                    <div class="no-video-placeholder" id="noRemoteVideo">
                        <div class="placeholder-icon">👤</div>
                        <p>Menunggu peserta lain bergabung...</p>
                    </div>
                </div>

                <!-- Local Video (Anda) -->
                <div class="video-wrapper local-video-wrapper">
                    <video id="localVideo" autoplay muted playsinline></video>
                    <div class="video-label">
                        <span id="localUserName">Anda</span>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button id="toggleAudio" class="btn-control" title="Matikan/Nyalakan Mikrofon">
                    <svg class="icon-on" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                    <svg class="icon-off hidden" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                        <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
                        <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                </button>

                <button id="toggleVideo" class="btn-control" title="Matikan/Nyalakan Kamera">
                    <svg class="icon-on" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 7l-7 5 7 5V7z"></path>
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                    </svg>
                    <svg class="icon-off hidden" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m5.66 0H14a2 2 0 0 1 2 2v3.34l1 1L23 7v10"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </button>

                <button id="toggleChat" class="btn-control" title="Buka/Tutup Chat">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span class="badge hidden" id="chatBadge">0</span>
                </button>

                <button id="endCall" class="btn-control btn-danger" title="Akhiri Konsultasi">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                    </svg>
                </button>
            </div>

            <!-- Room Info -->
            <div class="room-info">
                <div class="info-item">
                    <strong>ID Ruang:</strong> <span id="currentRoomId"></span>
                </div>
                <div class="info-item">
                    <strong>Peserta:</strong> <span id="participantCount">1</span>
                </div>
            </div>
        </div>

        <!-- Chat Panel -->
        <div id="chatPanel" class="chat-panel hidden">
            <div class="chat-header">
                <h3>Pesan</h3>
                <button id="closeChat" class="btn-close">&times;</button>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Ketik pesan...">
                <button id="sendChat" class="btn btn-primary">Kirim</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
